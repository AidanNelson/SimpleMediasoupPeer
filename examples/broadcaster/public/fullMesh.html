<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <style>
        html,
        body {
            background-color: #000;
            color: #fff;
        }
    </style>
    <script src="http://localhost:9000/SimpleMediasoupPeer.js" type="text/javascript"></script>
</head>

<body>

    <div style="display: flex; flex-direction: row; justify-content: center; width: 100vw; margin: auto; gap: 10px;">
        <label for="videoSource">Camera</label><select id="videoSource"></select>
    </div>


    <div
        style="display: flex; flex-direction: column; justify-content: center; max-width: 400px; margin: auto; gap: 10px;">
        <video style="max-width: 100%;" id="local_video"></video>
    
    </div>
    <div id="container" style="display: flex; flex-direction: row; flex-wrap: wrap; gap: 10px;"></div>



    <script>
        let socket;
        let mediasoupPeer;
        let localCam;


        async function startBroadcast() {
            let videoTrack = localCam.getVideoTracks()[0];
            await mediasoupPeer.addTrack({ track: videoTrack, label: "video" });
        }

        async function main() {
            console.log("~~~~~~~~~~~~~~~~~");

            mediasoupPeer = new SimpleMediasoupPeer();
            await mediasoupPeer.joinRoom("fullMesh");
            mediasoupPeer.on("track", gotTrack);
            mediasoupPeer.on("trackRemoved", gotTrackRemoved);

            await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            getDevices();
        }

        function    gotTrack({ track, peerId, label }) {
            console.log(`Got track of kind ${label} from ${peerId}`);

            let container = document.getElementById("container");

            let videoEl = document.createElement("video");
            videoEl.style.width = "200px";
            videoEl.id = `${peerId}_${label}`;
            container.appendChild(videoEl);

            videoEl.srcObject = null;
            videoEl.srcObject = new MediaStream([track]);

            videoEl.onloadedmetadata = (e) => {
                videoEl.play().catch((e) => {
                    console.log("Play Error: " + e);
                });
            }
        }

        function gotTrackRemoved({ label, peerId }) {
            console.log("track removed", label, peerId);
            let videoEl = document.getElementById(`${peerId}_${label}`);
            videoEl.remove();
        }

        main();

        //*//*//*//*//*//*//*//*//*//*//*//*//*//*//*//*//*//*//
        // user media

        const videoElement = document.getElementById("local_video");
        const videoInputSelect = document.querySelector("select#videoSource");
        const selectors = [videoInputSelect];

        videoInputSelect.addEventListener("change", startStream);

        async function getDevices() {
            let devicesInfo = await navigator.mediaDevices.enumerateDevices();
            gotDevices(devicesInfo);
            await startStream();
        }

        function gotDevices(deviceInfos) {
            // Handles being called several times to update labels. Preserve values.
            const values = selectors.map((select) => select.value);
            selectors.forEach((select) => {
                while (select.firstChild) {
                    select.removeChild(select.firstChild);
                }
            });
            for (let i = 0; i !== deviceInfos.length; ++i) {
                const deviceInfo = deviceInfos[i];
                const option = document.createElement("option");
                option.value = deviceInfo.deviceId;

                if (deviceInfo.kind === "videoinput") {
                    option.text = deviceInfo.label || `camera ${videoInputSelect.length + 1}`;
                    videoInputSelect.appendChild(option);
                }
            }
            selectors.forEach((select, selectorIndex) => {
                if (
                    Array.prototype.slice.call(select.childNodes).some((n) => n.value === values[selectorIndex])
                ) {
                    select.value = values[selectorIndex];
                }
            });
        }

        function gotStream(stream) {
            localCam = stream; // make stream available to console

            const videoTrack = localCam.getVideoTracks()[0];

            // add video stream to DOM for local testing
            // don't add audio to avoid feedback
            let videoStream = new MediaStream([videoTrack]);
            if ("srcObject" in videoElement) {
                videoElement.srcObject = videoStream;
            } else {
                videoElement.src = window.URL.createObjectURL(videoStream);
            }

            videoElement.play();

            // Refresh button list in case labels have become available
            return navigator.mediaDevices.enumerateDevices();
        }

        function handleError(error) {
            console.log("navigator.MediaDevices.getUserMedia error: ", error.message, error.name);
        }

        async function startStream() {
            console.log("getting local stream");
            if (localCam) {
                localCam.getTracks().forEach((track) => {
                    track.stop();
                });
            }

            const videoSource = videoInputSelect.value;
            const constraints = {
                audio: false,
                video: {
                    deviceId: videoSource ? { exact: videoSource } : undefined,
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                },
            };
            navigator.mediaDevices
                .getUserMedia(constraints)
                .then(gotStream)
                .then(gotDevices)
                .then(() => startBroadcast())
                .catch(handleError);
        }

    </script>
</body>

</html>
